apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-operator
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://helm.knative-operator.io/
    targetRevision: "1.19.1"
    chart: knative-operator
    helm: {}
      #valueFiles:
      #- $values/values/knative-operator/knative-operator/base/values.yaml
      #- $values/values/knative-operator/knative-operator/homelab/values.yaml
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    ref: values
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    path: manifests/knative-operator/knative-operator/
  destination:
    name: in-cluster
    namespace: knative-operator
  syncPolicy:
    #automated:
    #  selfHeal: true
    #  prune: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - IncludeMutationWebhook=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - ServerSideDiff=true
    - Validate=false