apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://argoproj.github.io/argo-helm
    targetRevision: "9.5.17"
    chart: argo-cd
    helm:
      valueFiles:
      - $values/values/argocd/argocd/base/values.yaml
      - $values/values/argocd/argocd/homelab/values.yaml
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    ref: values
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    path: manifests/argocd/argocd
  destination:
    name: in-cluster
    namespace: argocd
  ignoreDifferences:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    jqPathExpressions:
    - '.spec.parentRefs[]?.group'
    - '.spec.parentRefs[]?.kind'
    - '.spec.rules[]?.backendRefs[]?.group'
    - '.spec.rules[]?.backendRefs[]?.kind'
    - '.spec.rules[]?.backendRefs[]?.weight'
  - group: gateway.networking.k8s.io
    kind: GRPCRoute
    jqPathExpressions:
    - '.spec.parentRefs[]?.group'
    - '.spec.parentRefs[]?.kind'
    - '.spec.rules[]?.backendRefs[]?.group'
    - '.spec.rules[]?.backendRefs[]?.kind'
    - '.spec.rules[]?.backendRefs[]?.weight'
  syncPolicy:
    #automated:
    #  selfHeal: true
    #  prune: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - IncludeMutationWebhook=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - ServerSideDiff=true
    - Validate=false
