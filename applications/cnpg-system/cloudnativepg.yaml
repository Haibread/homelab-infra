apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: https://cloudnative-pg.io/charts/
    targetRevision: "0.28.0"
    chart: cloudnative-pg
    helm:
      valueFiles:
      - $values/values/cnpg-system/cloudnative-pg/base/values.yaml
      - $values/values/cnpg-system/cloudnative-pg/homelab/values.yaml
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    ref: values
  #- repoURL: https://github.com/Haibread/homelab-infra.git
  #  targetRevision: "main"
  #  path: manifests/cnpg-system/cloudnative-pg
  destination:
    name: in-cluster
    namespace: cnpg-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
    #automated:
    #  selfHeal: true
    #  prune: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - IncludeMutationWebhook=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - ServerSideDiff=true
    - Validate=false