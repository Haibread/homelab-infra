apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  project: default
  sources:
  - repoURL: oci://docker.io/envoyproxy/gateway-helm
    targetRevision: "1.6.5"
    chart: gateway-helm
    helm:
      valueFiles:
      - $values/values/envoy-gateway/envoy-gateway/base/values.yaml
      - $values/values/envoy-gateway/envoy-gateway/homelab/values.yaml
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    ref: values
  destination:
    name: in-cluster
    namespace: envoy-gateway
  syncPolicy:
    #automated:
    #  selfHeal: true
    #  prune: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - IncludeMutationWebhook=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - ServerSideDiff=true
    - Validate=false
