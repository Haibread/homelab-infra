apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-ai-gateway
  namespace: argocd
spec:
  project: default
  sources:
  - repoURL: docker.io/envoyproxy
    targetRevision: "1.3.0"
    chart: ai-gateway-helm
    helm:
      valueFiles:
      - $values/values/envoy-gateway/envoy-ai-gateway/base/values.yaml
      - $values/values/envoy-gateway/envoy-ai-gateway/homelab/values.yaml
  - repoURL: docker.io/envoyproxy
    targetRevision: "1.3.0"
    chart: ai-gateway-crds-helm
  - repoURL: https://github.com/Haibread/homelab-infra.git
    targetRevision: "main"
    ref: values
  destination:
    name: in-cluster
    namespace: envoy-gateway
  ignoreDifferences:
  - kind: Secret
    name: ai-gateway-controller-file-id-encryption
    namespace: envoy-gateway
    jsonPointers:
    - /data
  - kind: Secret
    name: ai-gateway-controller-mcp-session-encryption
    namespace: envoy-gateway
    jsonPointers:
    - /data
  - kind: Secret
    name: self-signed-cert-for-mutating-webhook
    namespace: envoy-gateway
    jsonPointers:
    - /data
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    name: envoy-ai-gateway-gateway-pod-mutator.envoy-gateway
    jqPathExpressions:
    - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    #automated:
    #  selfHeal: true
    #  prune: true
    syncOptions:
    - ApplyOutOfSyncOnly=true
    - CreateNamespace=true
    - IncludeMutationWebhook=true
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - ServerSideDiff=true
    - Validate=false
