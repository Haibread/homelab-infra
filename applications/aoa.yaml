---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aoa
  namespace: argocd
spec:
  destination:
    namespace: argocd
    name: in-cluster
  project: default
  source:
    repoURL: https://github.com/Haibread/homelab-infra.git
    path: applications/
    targetRevision: "HEAD"
    directory:
      recurse: true
  # syncPolicy is intentionally absent: the app-of-apps is synced by hand.
  # An empty `syncPolicy:` key serialises to null and is rejected by the
  # Application schema.
