---
# Pragmatic config: catch YAML *syntax* errors (unparseable files, duplicate keys,
# bad anchors) without imposing style rules the existing manifests don't follow.
# Tighten later by re-enabling individual rules as the repo is cleaned up.
extends: relaxed

rules:
  line-length: disable
  document-start: disable
  empty-lines: disable
  trailing-spaces: disable
  new-line-at-end-of-file: disable
  indentation: disable
  truthy: disable
  comments: disable
  comments-indentation: disable
  braces: disable
  brackets: disable
  colons: disable
  commas: disable
  hyphens: disable
  empty-values: disable
