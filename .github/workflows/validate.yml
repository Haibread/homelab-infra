---
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.7.0"
  KUSTOMIZE_VERSION: "5.7.2"
  YQ_VERSION: "4.47.3"
  HELM_VERSION: "v3.20.0"

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --upgrade yamllint==1.37.1
      - run: yamllint -c .yamllint.yaml .

  kubeconform-raw:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Validate raw manifest files
        run: |
          set -euo pipefail
          # Everything in manifests/ that isn't part of a kustomize overlay
          # (kustomize overlays are validated in the kustomize-build job).
          mapfile -t files < <(find manifests -type f -name '*.yaml' \
            ! -name 'kustomization.yaml' \
            ! -path '*/components/*' | sort)
          # Exclude files that are referenced as resources by a kustomization;
          # easier to just run kubeconform on every yaml — duplication is fine.
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            "${files[@]}"

  kustomize-build:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install kustomize
        run: |
          curl -fsSL -o kz.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kz.tgz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Build every kustomization and validate
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r k; do
            dir="$(dirname "$k")"
            echo "=== kustomize build $dir ==="
            if ! kustomize build "$dir" | kubeconform \
                -strict -ignore-missing-schemas -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'; then
              echo "::error file=$k::kustomize build / kubeconform failed"
              fail=$((fail+1))
            fi
          done < <(find manifests -name kustomization.yaml | sort)
          exit "$fail"

  helm-render:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install yq
        run: |
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Render and validate every Application
        run: bash .github/scripts/render-apps.sh

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
