---
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Every tool is pinned: an unpinned toolchain silently changes what CI means
  # from one run to the next. Renovate bumps these through the customManager
  # keyed on the "# renovate:" comments.
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.+)$
  KUSTOMIZE_VERSION: "5.8.1"
  # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
  KUBECONFORM_VERSION: "0.8.0"
  # renovate: datasource=github-releases depName=mikefarah/yq extractVersion=^v(?<version>.+)$
  YQ_VERSION: "4.53.3"
  # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.+)$
  HELM_VERSION: "4.2.3"

  # Kinds with CRD schemas in datreeio/CRDs-catalog that are too strict
  # (reject legitimate null values on optional object fields). Revisit when
  # a cleaner schema source is available.
  KUBECONFORM_SKIP: "CephCluster,CephBlockPool,CephFilesystem,CephObjectStore"
  # Fallback schema source for CRDs the built-in Kubernetes schemas don't cover.
  KUBECONFORM_CRD_SCHEMA: >-
    https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  kubeconform-applications:
    name: kubeconform (argocd applications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/kubeconform
        with:
          version: ${{ env.KUBECONFORM_VERSION }}
      - name: Validate ArgoCD Application manifests
        # No -ignore-missing-schemas here on purpose: the whole point of this
        # job is that the argoproj.io Application schema really was applied,
        # so a missing schema must fail rather than pass silently.
        run: |
          set -euo pipefail
          mapfile -t files < <(find applications -type f -name '*.yaml' | sort)
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location "${KUBECONFORM_CRD_SCHEMA}" \
            "${files[@]}"

  kubeconform-raw:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/kubeconform
        with:
          version: ${{ env.KUBECONFORM_VERSION }}
      - name: Validate raw manifest files
        run: |
          set -euo pipefail
          mapfile -t files < <(find manifests -type f -name '*.yaml' \
            ! -name 'kustomization.yaml' | sort)
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -skip "${KUBECONFORM_SKIP}" \
            -summary \
            -schema-location default \
            -schema-location "${KUBECONFORM_CRD_SCHEMA}" \
            "${files[@]}"

  kustomize-build:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/kubeconform
        with:
          version: ${{ env.KUBECONFORM_VERSION }}
      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o kz.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kz.tgz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/
          rm -f kz.tgz kustomize
      - name: Build every kustomization and validate
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r k; do
            dir="$(dirname "$k")"
            echo "=== kustomize build $dir ==="
            if ! kustomize build "$dir" | kubeconform \
                -strict \
                -ignore-missing-schemas \
                -skip "${KUBECONFORM_SKIP}" \
                -summary \
                -schema-location default \
                -schema-location "${KUBECONFORM_CRD_SCHEMA}"; then
              echo "::error file=$k::kustomize build / kubeconform failed"
              fail=$((fail+1))
            fi
          done < <(find manifests -name kustomization.yaml | sort)
          exit "$fail"

  helm-render:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: "v${{ env.HELM_VERSION }}"
      - name: Cache Helm chart downloads
        # Helm stores repo indexes + pulled chart archives under
        # ~/.cache/helm/repository and OCI chart blobs under registry/cache.
        # The key is re-derived from every Application manifest so a chart
        # version bump invalidates the cache automatically.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/helm/repository
            ~/.cache/helm/registry
          key: helm-${{ runner.os }}-${{ hashFiles('applications/**/*.yaml') }}
          restore-keys: |
            helm-${{ runner.os }}-
      - uses: ./.github/actions/kubeconform
        with:
          version: ${{ env.KUBECONFORM_VERSION }}
      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Render and validate every Application
        run: bash .github/scripts/render-apps.sh

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "24"
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
