---
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned only where the download URL embeds the version. Tools with
  # version-agnostic asset names are fetched from /releases/latest/download/.
  KUSTOMIZE_VERSION: "5.8.1"
  # Kinds with CRD schemas in datreeio/CRDs-catalog that are too strict
  # (reject legitimate null values on optional object fields). Revisit when
  # a cleaner schema source is available.
  KUBECONFORM_SKIP: "CephCluster,CephBlockPool,CephFilesystem,CephObjectStore,CephCluster/v1"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1

  kubeconform-raw:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Validate raw manifest files
        run: |
          set -euo pipefail
          mapfile -t files < <(find manifests -type f -name '*.yaml' \
            ! -name 'kustomization.yaml' | sort)
          kubeconform \
            -ignore-missing-schemas \
            -skip "${KUBECONFORM_SKIP}" \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            "${files[@]}"

  kustomize-build:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install kustomize
        run: |
          curl -fsSL -o kz.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kz.tgz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Build every kustomization and validate
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r k; do
            dir="$(dirname "$k")"
            echo "=== kustomize build $dir ==="
            if ! kustomize build "$dir" | kubeconform \
                -ignore-missing-schemas \
                -skip "${KUBECONFORM_SKIP}" \
                -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'; then
              echo "::error file=$k::kustomize build / kubeconform failed"
              fail=$((fail+1))
            fi
          done < <(find manifests -name kustomization.yaml | sort)
          exit "$fail"

  helm-render:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Render and validate every Application
        env:
          KUBECONFORM_SKIP: ${{ env.KUBECONFORM_SKIP }}
        run: bash .github/scripts/render-apps.sh

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
