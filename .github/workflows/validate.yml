---
name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned only where the download URL embeds the version. Tools with
  # version-agnostic asset names are fetched from /releases/latest/download/.
  KUSTOMIZE_VERSION: "5.8.1"
  # Kinds with CRD schemas in datreeio/CRDs-catalog that are too strict
  # (reject legitimate null values on optional object fields). Revisit when
  # a cleaner schema source is available.
  KUBECONFORM_SKIP: "CephCluster,CephBlockPool,CephFilesystem,CephObjectStore,CephCluster/v1"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  kubeconform-raw:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Validate raw manifest files
        run: |
          set -euo pipefail
          mapfile -t files < <(find manifests -type f -name '*.yaml' \
            ! -name 'kustomization.yaml' | sort)
          kubeconform \
            -ignore-missing-schemas \
            -skip "${KUBECONFORM_SKIP}" \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json' \
            "${files[@]}"

  kustomize-build:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install kustomize
        run: |
          curl -fsSL -o kz.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kz.tgz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Build every kustomization and validate
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r k; do
            dir="$(dirname "$k")"
            echo "=== kustomize build $dir ==="
            if ! kustomize build "$dir" | kubeconform \
                -ignore-missing-schemas \
                -skip "${KUBECONFORM_SKIP}" \
                -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'; then
              echo "::error file=$k::kustomize build / kubeconform failed"
              fail=$((fail+1))
            fi
          done < <(find manifests -name kustomization.yaml | sort)
          exit "$fail"

  helm-render:
    name: helm template + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0
      - name: Cache Helm chart downloads
        # Helm 3 on Linux stores repo indexes + pulled chart archives under
        # ~/.cache/helm/repository and OCI chart blobs under registry/cache.
        # The key is re-derived from every Application manifest so a chart
        # version bump invalidates the cache automatically.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/helm/repository
            ~/.cache/helm/registry
          key: helm-${{ runner.os }}-${{ hashFiles('applications/**/*.yaml') }}
          restore-keys: |
            helm-${{ runner.os }}-
      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz \
            "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar -xzf kc.tgz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/
      - name: Render and validate every Application
        env:
          KUBECONFORM_SKIP: ${{ env.KUBECONFORM_SKIP }}
        run: bash .github/scripts/render-apps.sh

  renovate-config:
    name: renovate config validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
