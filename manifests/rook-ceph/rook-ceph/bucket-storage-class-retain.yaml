# Same object store as rook-ceph-bucket-main, but deleting the claim keeps the
# bucket: a backup bucket must outlive the namespace and the database it backs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-bucket-main-retain
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  objectStoreName: main
  objectStoreNamespace: rook-ceph
  region: us-east-1
