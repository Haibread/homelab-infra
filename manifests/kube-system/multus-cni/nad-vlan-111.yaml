# VLAN 111 - update master to match the VLAN sub-interface on your nodes (e.g. eth0.111, bond0.111)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-111
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vlan-111",
      "type": "macvlan",
      "master": "eth0.111",
      "mode": "bridge",
      "ipam": {
        "type": "dhcp"
      }
    }
