# Untagged (native VLAN) - update master to match the physical interface on your nodes (e.g. eth0, bond0, ens3)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: untagged
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "untagged",
      "type": "macvlan",
      "master": "eth0",
      "mode": "bridge",
      "ipam": {
        "type": "dhcp"
      }
    }
