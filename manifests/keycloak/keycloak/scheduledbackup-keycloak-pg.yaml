apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: keycloak-pg-daily
spec:
  schedule: "0 0 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: keycloak-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
