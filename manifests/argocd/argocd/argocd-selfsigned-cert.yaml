apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: argocd-ca
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-ca-cert
  namespace: argocd
spec:
  isCA: true
  commonName: argocd-ca
  secretName: argocd-ca-secret
  issuerRef:
    name: argocd-ca
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-cert
  namespace: argocd
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: argocd-ca
    kind: ClusterIssuer
  dnsNames:
    - argocd-server.argocd.svc.cluster.local