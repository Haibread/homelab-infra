apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: argocd-backend-tls
  namespace: argocd
spec:
  targetRefs:
    - kind: Service
      name: argocd-server
      group: ""
  validation:
    caCertificateRefs:
      - kind: ConfigMap
        name: argocd-server-ca-cert
        group: ""
    hostname: argocd-server.argocd.svc.cluster.local