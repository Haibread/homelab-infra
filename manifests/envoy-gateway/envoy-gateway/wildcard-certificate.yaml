apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-newgamer-lan
  namespace: envoy-gateway
spec:
  secretName: wildcard-newgamer-lan-tls
  commonName: "*.newgamer.lan"
  dnsNames:
    - "*.newgamer.lan"
    - "newgamer.lan"
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
