apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: ai-registry-postgres-backups
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://ai-registry-postgres-backups/
    endpointURL: http://rook-ceph-rgw-main.rook-ceph.svc:80
    s3Credentials:
      accessKeyId:
        name: ai-registry-postgres-backups
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: ai-registry-postgres-backups
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: zstd
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
