defaultPodOptions:
  securityContext:
    fsGroup: 1000

controllers:
  keycloak:
    containers:
      app:
        image:
          repository: quay.io/keycloak/keycloak
          tag: "26.7.0"
        args:
          - start
        env:
          KC_DB: postgres
          KC_DB_URL: jdbc:postgresql://keycloak-pg-rw.keycloak.svc.cluster.local:5432/app
          KC_DB_USERNAME: app
          KC_HOSTNAME: auth.basget.io
          KC_PROXY_HEADERS: xforwarded
          KC_HTTP_ENABLED: "true"
          KC_HOSTNAME_STRICT_HTTPS: "false"
          KC_HEALTH_ENABLED: "true"
          KC_DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: keycloak-pg-app
                key: password
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/live
                port: 9000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/ready
                port: 9000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: keycloak
    ports:
      http:
        port: 8080

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /opt/keycloak/data
