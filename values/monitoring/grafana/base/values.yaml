replicas: 2

#serviceMonitor:

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

persistence:
  enabled: false # Will use pg

grafana.ini:
  database:
    type: postgres
    host: grafana-pg-rw.monitoring.svc.cluster.local:5432
    name: app
    user: grafana
    ssl_mode: require     # CNPG enables TLS by default

env:
  GF_DATABASE_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: grafana-pg-app
        key: password

extraConfigmapMounts:
  - name: cnpg-ca
    mountPath: /etc/ssl/certs/cnpg-ca.crt
    subPath: ca.crt
    configMap: grafana-pg-ca
    readOnly: true

datasources: {}

dashboardProviders: {}

sidecar:
  alerts:
    enabled: true
  dashboards:
    enabled: true
  datasources:
    enabled: true
  plugins:
    enabled: true