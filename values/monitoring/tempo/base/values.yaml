---
# Tempo 3.x write path: distributor -> Kafka -> block-builder (blocks to S3)
#                                          \-> live-store (recent-trace reads)
# The ingester and the standalone compactor are gone; compaction and retention
# run in backend-scheduler + backend-worker.

multitenancyEnabled: true

# Every Tempo binary pod reads the S3 credentials from the ObjectBucketClaim
# secret and expands them out of tempo.yaml at startup. `defaults` feeds only
# the Tempo pod template, so the nginx gateway and memcached are untouched.
defaults:
  extraArgs:
  - "-config.expand-env=true"
  extraEnv:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: tempo-traces
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: tempo-traces
        key: AWS_SECRET_ACCESS_KEY

traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: rook-ceph-rgw-main.rook-ceph.svc.cluster.local:80
      region: us-east-1
      access_key: "${AWS_ACCESS_KEY_ID}"
      secret_key: "${AWS_SECRET_ACCESS_KEY}"
      insecure: true
      forcepathstyle: true

# The topic is created and sized by the Strimzi KafkaTopic, not by Tempo.
ingest:
  kafka:
    address: kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
    topic: tempo-traces
    auto_create_topic_enabled: false

# Two pods cover the topic's four partitions: ordinal 0 takes partitions 0-1,
# ordinal 1 takes 2-3. Every partition has a consumer, which is what keeps
# records from expiring in Kafka before they reach object storage.
blockBuilder:
  enabled: true
  replicas: 2
  config:
    partitions_per_instance: 2

# One live-store per partition: a partition only becomes a write target once a
# live-store owns it, and only its owner serves that partition's recent traces.
liveStore:
  enabled: true
  replicas: 4
  # A retained volume lets a live-store resume from its committed Kafka offset
  # instead of replaying the whole lookback window on every restart.
  persistence:
    enabled: true
    size: 5Gi

backendScheduler:
  enabled: true

backendWorker:
  replicas: 1

distributor:
  replicas: 2

querier:
  replicas: 2

queryFrontend:
  replicas: 2

metricsGenerator:
  enabled: false

memcached:
  enabled: true
  replicas: 1
  allocatedMemory: 512

gateway:
  enabled: true
  replicas: 2
