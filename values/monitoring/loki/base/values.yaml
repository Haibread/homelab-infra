deploymentMode: Distributed

global:
  extraArgs:
    - -config.expand-env=true

chunks_bucket_env: &chunks_bucket_env
    - name: CHUNKS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-main-loki-chunks
          key: AccessKey
    - name: CHUNKS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-main-loki-chunks
          key: SecretKey

ruler_bucket_env: &ruler_bucket_env
    - name: RULER_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-main-loki-ruler
          key: AccessKey
    - name: RULER_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rook-ceph-object-user-main-loki-ruler
          key: SecretKey

loki:
  auth_enabled: true 

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true

  commonConfig:
    path_prefix: /var/loki
    replication_factor: 2

  storage:
    type: s3
    s3:
      endpoint: http://rook-ceph-rgw-my-main.rook-ceph.svc.cluster.local:80
      region: us-east-1
      accessKeyId: ${ACCESS_KEY_ID}
      secretAccessKey: ${SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler

  schemaConfig:
    configs:
      - from: "2026-03-03"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
    
  ui:
    enabled: true

  query_range:
    align_queries_with_step: true

ingester:
  replicas: 3
  extraEnv: *chunks_bucket_env
querier:
  replicas: 3
  maxUnavailable: 2
  extraEnv: *chunks_bucket_env
queryFrontend:
  replicas: 2
  maxUnavailable: 1
queryScheduler:
  replicas: 2
distributor:
  replicas: 3
  maxUnavailable: 2
compactor:
  replicas: 1
  extraEnv: *chunks_bucket_env
indexGateway:
  replicas: 2
  maxUnavailable: 1
ruler:
  replicas: 2
  maxUnavailable: 1
  extraEnv: *ruler_bucket_env

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0