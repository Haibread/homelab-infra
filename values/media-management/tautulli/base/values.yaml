controllers:
  tautulli:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/tautulli
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: tautulli
    ports:
      http:
        port: 8181

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /config
