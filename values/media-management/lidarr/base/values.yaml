controllers:
  lidarr:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/lidarr
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: lidarr
    ports:
      http:
        port: 8686

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 15Gi
    globalMounts:
      - path: /config
  music:
    type: nfs
    server: 192.168.0.150
    path: /mnt/HDD/Musique
    globalMounts:
      - path: /music
  downloads:
    type: nfs
    server: 192.168.0.150
    path: /mnt/HDD/Musique
    globalMounts:
      - path: /downloads
