controllers:
  radarr:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: 7.0.3.10918-ls328
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 7878
              periodSeconds: 10
              # Database migrations run before the port opens; on this library
              # (~18 GiB of /config) a major upgrade takes minutes, and the
              # 30 s liveness window would kill the pod mid-migration.
              failureThreshold: 180
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi

service:
  app:
    controller: radarr
    ports:
      http:
        port: 7878

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 50Gi
    globalMounts:
      - path: /config
  movies:
    type: nfs
    server: 192.168.0.150
    path: /mnt/Storage/Media
    globalMounts:
      - path: /movies
  downloads:
    type: nfs
    server: 192.168.0.150
    path: /mnt/Storage/Media
    globalMounts:
      - path: /downloads
