controllers:
  radarr:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: 6.3.0.10514-ls312
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: radarr
    ports:
      http:
        port: 7878

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 50Gi
    globalMounts:
      - path: /config
  movies:
    type: nfs
    server: 192.168.0.150
    path: /mnt/Storage/Media
    globalMounts:
      - path: /movies
  downloads:
    type: nfs
    server: 192.168.0.150
    path: /mnt/Storage/Media
    globalMounts:
      - path: /downloads
