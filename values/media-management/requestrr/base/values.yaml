controllers:
  requestrr:
    containers:
      app:
        image:
          repository: darkalfx/requestrr
          tag: V2.1.3
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

service:
  app:
    controller: requestrr
    ports:
      http:
        port: 4545

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /root/config
