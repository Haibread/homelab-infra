controllers:
  flaresolverr:
    containers:
      app:
        image:
          repository: ghcr.io/thephaseless/byparr
          tag: latest@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
        env:
          LOG_LEVEL: info
          LOG_HTML: "false"
          CAPTCHA_SOLVER: harvester
          HARVESTER_ENDPOINT: https://172.0.0.1:5000/token
          no_sandbox: "true"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: flaresolverr
    ports:
      http:
        port: 8191
