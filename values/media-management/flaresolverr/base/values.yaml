controllers:
  flaresolverr:
    containers:
      app:
        image:
          repository: ghcr.io/thephaseless/byparr
          tag: latest@sha256:b44c612ef598e593346852a9a9ce92b8789e9ac8080544bdd38e125b99a2ee69
        env:
          LOG_LEVEL: info
          LOG_HTML: "false"
          CAPTCHA_SOLVER: harvester
          HARVESTER_ENDPOINT: https://172.0.0.1:5000/token
          no_sandbox: "true"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

service:
  app:
    controller: flaresolverr
    ports:
      http:
        port: 8191
