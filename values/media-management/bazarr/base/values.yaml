controllers:
  bazarr:
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.5.6-ls342
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

service:
  app:
    controller: bazarr
    ports:
      http:
        port: 6767

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    globalMounts:
      - path: /config
  movies:
    type: nfs
    server: 192.168.0.150
    path: /mnt/Storage/Media/radarr
    globalMounts:
      - path: /movies
  tv:
    type: nfs
    server: 192.168.0.95
    path: /mnt/SAS14T/Media/TVs/Sonarr/Sonarr
    globalMounts:
      - path: /tv
