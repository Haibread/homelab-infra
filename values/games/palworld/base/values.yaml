defaultPodOptions:
  # The entrypoint traps SIGTERM to save the world and shut the server down
  # cleanly. Upstream's compose file allows 30s; give it more headroom so a
  # large save never gets SIGKILLed mid-write.
  terminationGracePeriodSeconds: 120

controllers:
  palworld:
    type: deployment
    # Single replica on a ReadWriteOnce volume: the old pod has to release the
    # PVC before the new one can mount it, so no rolling update.
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/thijsvanloef/palworld-server-docker
          tag: v2.7.1
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Paris
          LOG_LEVEL: INFO
          PORT: "8211"
          QUERY_PORT: "27015"
          PLAYERS: "16"
          # Community listing requires a public IP and a password-less server.
          COMMUNITY: "false"
          # Adds -useperfthreads -NoAsyncLoadingThread -UseMultithreadForDS.
          ENABLE_PERF_THREADING_ARGS: "true"
          # Always set this explicitly. The deprecated MULTITHREADING variable
          # derives it from `nproc --all`, which reports the node's 56 cores
          # rather than anything this pod was allocated.
          WORKER_THREADS_SERVER: "10"
          # Both of these stay on the ClusterIP service only -- never expose
          # them through the LoadBalancer.
          REST_API_ENABLED: "true"
          REST_API_PORT: "8212"
          RCON_ENABLED: "true"
          RCON_PORT: "25575"
          # Pull the current game build from Steam on every start, so the
          # server always matches what clients are running.
          UPDATE_ON_BOOT: "true"
          # The image tag only pins the wrapper -- UPDATE_ON_BOOT already
          # pulls whatever build Steam is serving, so the game version was
          # never reproducible from git. The check itself is one cheap HTTP
          # call to api.steamcmd.net compared against the local manifest; it
          # only becomes disruptive on the rare run where a patch actually
          # landed, so checking every 15 minutes costs nothing on the other
          # ~96 runs a day. Once daily left up to 24h where Steam had
          # auto-updated clients but the server hadn't, so nobody could
          # connect.
          AUTO_UPDATE_ENABLED: "true"
          AUTO_UPDATE_CRON_EXPRESSION: "*/15 * * * *"
          AUTO_UPDATE_WARN_MINUTES: "15"
          # Nightly reboot at 05:00 Europe/Paris (supercronic honours TZ),
          # two hours clear of the 03:00 backup. It runs unconditionally --
          # see AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE below -- though at that
          # hour it usually finds the server empty anyway.
          #
          # Mechanically it is a clean save + `rest-cli shutdown`: the
          # process exits and kubelet restarts the container in place under
          # the deployment's default restartPolicy: Always, so the PVC is
          # never unmounted. That is gentler than recreating the pod, and
          # the reason this lives in the entrypoint instead of a CronJob
          # running `kubectl rollout restart`. auto_reboot.sh hard-requires
          # REST_API_ENABLED and gives up if it is ever turned off above.
          AUTO_REBOOT_ENABLED: "true"
          AUTO_REBOOT_CRON_EXPRESSION: "0 5 * * *"
          # Reboot even with players connected, skipping the player-count
          # check entirely. A reboot any single night owl can veto is one
          # that quietly stops happening during exactly the busy stretches
          # that make it worth having; the countdown below is what keeps
          # that civil.
          AUTO_REBOOT_EVEN_IF_PLAYERS_ONLINE: "true"
          # With the check above skipped this is a real grace period rather
          # than a formality. countdown_message broadcasts at 5, 3, 2 and 1
          # minutes, then at 30s and 10s, and re-polls the player list every
          # minute so it cuts the wait short once the last player logs off.
          # On an already empty server it returns immediately.
          AUTO_REBOOT_WARN_MINUTES: "5"
          BACKUP_ENABLED: "true"
          BACKUP_CRON_EXPRESSION: "0 3 * * *"
          DELETE_OLD_BACKUPS: "true"
          OLD_BACKUP_DAYS: "7"
          # Gameplay rates. These are *decrease* rates: lower drains slower,
          # so 0.1 is the game's own minimum and makes flying mounts last
          # roughly ten times longer. Player stamina is a separate knob
          # (PLAYER_STAMINA_DECREASE_RATE) and stays at the default.
          PAL_STAMINA_DECREASE_RATE: "0.100000"
          # Hunger, same idea: pals get peckish roughly three times less
          # often. Not at the 0.1 floor because that would retire the whole
          # food chain -- plantations and ranches stop mattering when nobody
          # ever eats. 0.3 keeps food a thing you produce while killing the
          # part nobody enjoys, base workers abandoning their station every
          # few minutes to walk to the feed box. That last bit is also why
          # this is mildly good for the server: every trip to the box is AI
          # pathing we no longer simulate, which pushes the same direction
          # as the worker tuning above. Player hunger is a separate knob
          # (PLAYER_STOMACH_DECREASE_RATE) and stays at the default.
          PAL_STOMACH_DECREASE_RATE: "0.300000"
          EXP_RATE: "2.000000"
          # Default is 15. Every worker is an AI agent to simulate, so this
          # is the one setting here that pushes back against the perf
          # threading tuning above -- raise it further only if it holds up.
          BASE_CAMP_WORKER_MAX_NUM: "20"
          # Default is 4. More bases spread out costs far less than more
          # workers crammed into one: an empty base has no AI to simulate
          # until someone staffs it.
          BASE_CAMP_MAX_NUM_IN_GUILD: "8"
          # Seconds between autosaves, default 30. Each save is a brief
          # hitch everyone feels, so halving their frequency halves the
          # stutter. The trade is up to 60s of lost progress -- but only on
          # an unclean death (node loss, OOM kill, SIGKILL). Every ordinary
          # stop already saves first: the entrypoint traps SIGTERM, and the
          # nightly reboot calls save_server before shutting down.
          AUTO_SAVE_SPAN: "60.000000"
        envFrom:
        - secretRef:
            name: palworld-secret
        probes:
          # The image ships a pgrep-based healthcheck; there is no HTTP
          # endpoint to hit without authenticating against the REST API.
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                - pgrep
                - PalServer-Linux
              # First boot downloads ~8 GB through steamcmd, so allow 20
              # minutes before declaring the container dead.
              periodSeconds: 20
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                - pgrep
                - PalServer-Linux
              periodSeconds: 30
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                - pgrep
                - PalServer-Linux
              periodSeconds: 30
              failureThreshold: 3
        resources:
          requests:
            # No limits.cpu by convention in this repo -- a hard cap throttles
            # even when the node has cores to spare; the memory limit below
            # is what actually protects neighbors from a runaway process.
            cpu: "10"
            memory: 16Gi
          limits:
            memory: 32Gi

service:
  # Player-facing traffic. UDP only, published on the LAN through Cilium LB
  # IPAM + BGP -- Envoy Gateway is HTTP-only and cannot carry this.
  game:
    controller: palworld
    primary: true
    type: LoadBalancer
    # Local preserves the client source IP, which is what shows up in the
    # server logs and ban list. Cilium only advertises the VIP from nodes
    # that actually hold a ready endpoint.
    externalTrafficPolicy: Local
    # Cilium runs with kube-proxy-replacement and serves the VIP natively, so
    # the per-node ports Kubernetes allocates by default are never used --
    # they would only add listening surface on every node.
    allocateLoadBalancerNodePorts: false
    ports:
      game:
        port: 8211
        protocol: UDP
        primary: true
      query:
        port: 27015
        protocol: UDP
  # Admin surface: REST API and RCON. Cluster-internal on purpose.
  admin:
    controller: palworld
    type: ClusterIP
    ports:
      rest:
        port: 8212
        protocol: TCP
        primary: true
      rcon:
        port: 25575
        protocol: TCP

persistence:
  # Holds the Steam game files (~8 GB), the world saves and the backups.
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 50Gi
    # A wiped world is not recoverable from git. Keep the PVC around even if
    # the Application is deleted.
    retain: true
    globalMounts:
    - path: /palworld
