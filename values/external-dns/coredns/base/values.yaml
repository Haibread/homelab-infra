replicaCount: 3

rbac:
  create: true

# isClusterService specifies whether chart should be deployed as cluster-service or normal k8s app.
isClusterService: false

serviceType: LoadBalancer
service:
  annotations:
    lbipam.cilium.io/ips: 172.16.111.20

servers:
- zones:
  - zone: .
    use_tcp: true
  port: 53
  # -- expose the service on a different port
  # servicePort: 5353
  # If serviceType is nodePort you can specify nodePort here
  # nodePort: 30053
  # hostPort: 53
  plugins:
  - name: errors
  # Serves a /health endpoint on :8080, required for livenessProbe
  - name: health
    configBlock: |-
      lameduck 10s
  # Serves a /ready endpoint on :8181, required for readinessProbe
  - name: ready
  # Required to query kubernetes API for data
  #- name: kubernetes
  #  parameters: cluster.local in-addr.arpa ip6.arpa
  #  configBlock: |-
  #    pods insecure
  #    fallthrough in-addr.arpa ip6.arpa
  #    ttl 30
  # Serves a /metrics endpoint on :9153, required for serviceMonitor
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: forward
    parameters: . 10.0.10.1 192.168.0.1 /etc/resolv.conf
  - name: cache
    parameters: 30
  - name: loop
  - name: reload
  - name: loadbalance
  - name: etcd
    parameters: newgamer.lan
    configBlock: |-
      stubzones
      path /skydns
      endpoint https://etcd.external-dns:2379
      tls /etc/coredns/tls/etcd/tls.crt /etc/coredns/tls/etcd/tls.key /etc/coredns/tls/etcd/ca.crt

extraSecrets:
  - name: etcd-client-tls
    mountPath: /etc/coredns/tls/etcd
    defaultMode: 420
