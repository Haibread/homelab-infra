---
server:
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway
    hostnames:
      - argocd.newgamer.lan
    servicePort: 80
    rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
         - name: argocd-server
           port: 80
  
  grpcroute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway
    hostnames:
      - argocd.newgamer.lan
    rules:
      - matches:
        - headers:
            - name: Content-Type
              type: RegularExpression
              value: "^application/grpc.*$"