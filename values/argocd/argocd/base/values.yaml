---
global:
  networkPolicy:
    # Chart 10.x defaults this to true. Nothing else in this cluster runs a
    # NetworkPolicy, so enabling it here would make argocd the only
    # policy-enforced namespace, and Argo CD is the one component that
    # cannot be repaired through GitOps if it cuts itself off.
    create: false

server:
  service:
    appProtocol: true # gRPS cli HTTP/2
  insecure: true
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway
    hostnames:
      - argocd.newgamer.lan
    servicePort: 80
    rules:
      - matches:
        - path:
            type: PathPrefix
            value: /
        backendRefs:
         - name: argocd-server
           port: 80
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: X-Forwarded-Proto
                  value: https

  grpcroute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway
    hostnames:
      - argocd.newgamer.lan
    rules:
      - matches:
        - headers:
            - name: Content-Type
              type: RegularExpression
              value: "^application/grpc.*$"

configs:
  params:
    server.insecure: "true"
    server.rootpath: ""
    server.basehref: "/"
    server.url: "https://argocd.newgamer.lan"
