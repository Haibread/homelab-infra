registry: "ghcr.io"

providers:
  default: anthropic
  anthropic:
    apiKeySecretRef: kagent-anthropic-api-key
    apiKeySecretKey: apiKey
  #anthropic:
    #apiKey: ""  # Set via a Secret or external-secrets

kagent-tools:
  enabled: false

# The bundled agents and the Grafana MCP server are each their own subchart, so
# each is switched off by its own top-level key. A `tools:`/`agents:` block is
# not read by this chart at all: it was silently ignored, so every agent was
# created regardless, and nine of them then failed permanently because they
# reference the kagent-tools RemoteMCPServer that `kagent-tools.enabled: false`
# never creates.
grafana-mcp:
  enabled: false

argo-rollouts-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
helm-agent:
  enabled: false
istio-agent:
  enabled: false
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
observability-agent:
  enabled: false
promql-agent:
  enabled: false
